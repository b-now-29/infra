# 공용 Caddy. 서버의 ~/infra/에서 돈다. 앱들은 외부 네트워크 edge로 붙고, Caddy는 서비스 이름(app:8080, stadium:8080)으로 넘긴다.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN을 서버의 ~/infra/.env에 설정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # /java-quiz 정적 파일. b-now-29/app 서버 폴더(~/app/static)를 그대로 쓴다.
      - ../app/static:/srv/static:ro
      - caddy_data:/data        # 인증서 저장 (지우면 재발급됨)
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
    external: true

# b-now-29/app의 compose가 만들었던 volume을 이어 쓴다. 새로 만들면 인증서가 재발급되고 그동안 HTTPS가 멈춘다.
volumes:
  caddy_data:
    external: true
    name: app_caddy_data
  caddy_config:
    external: true
    name: app_caddy_config
